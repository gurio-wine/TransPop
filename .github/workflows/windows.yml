name: Build TransPop Rust Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust sources
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Build small native Windows exe
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package EXE and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/transpop.exe dist/TransPop.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath TransPop-Rust-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TransPop-Rust-win-x64
          path: TransPop-Rust-win-x64.zip
          if-no-files-found: error
