[package]
name = "transpop"
version = "0.7.0"
edition = "2021"
description = "Translate the highlighted Chinese IME candidate to English in real time on Windows"
license = "MIT"
repository = "https://github.com/gurio-wine/TransPop"
publish = false

[dependencies]
serde_json = "=1.0.145"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "native-certs"] }
uiautomation = { version = "=0.25.1", features = ["event"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security_Cryptography",
    "Win32_UI_Controls",
    "Win32_Graphics_Dwm",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
