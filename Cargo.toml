[package]
name = "transpop"
version = "0.6.4"
edition = "2024"
description = "Minimal Microsoft Pinyin candidate preview bubble for Windows 10/11"
license = "MIT"

[dependencies]
uiautomation = { version = "=0.25.1", default-features = false, features = ["input", "control"] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
